<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Driplik — Audit per e-commerce</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #07070f; color: #e0e0f0; font-family: 'IBM Plex Sans', sans-serif; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(12px);} to {opacity:1; transform:translateY(0);} }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
    @keyframes stepIn { from { opacity:0; transform:translateX(-8px);} to {opacity:1; transform:translateX(0);} }
    input::placeholder { color: #444; }
    input:focus { outline: none; border-color: #00e5a0 !important; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #1e1e2e; border-radius: 4px; }
    button { font-family: 'IBM Plex Sans', sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const CATEGORIES = [
      { key: "performance", label: "Performance", icon: "⚡" },
      { key: "ux",          label: "UX & Design",       icon: "◈" },
      { key: "checkout",    label: "Checkout",           icon: "◻" },
      { key: "seo",         label: "SEO",                icon: "◎" },
      { key: "trust",       label: "Fiducia",            icon: "◆" },
    ];

    const STEPS = [
      { id: "connect",    label: "Connessione al sito" },
      { id: "pagespeed",  label: "Misurazione performance" },
      { id: "vitals",     label: "Analisi Core Web Vitals" },
      { id: "seo",        label: "Scansione SEO" },
      { id: "ai",         label: "Elaborazione con AI" },
      { id: "report",     label: "Generazione report" },
    ];

    const scoreColor = (s) => s >= 80 ? "#00e5a0" : s >= 55 ? "#f0b429" : "#ff4d4d";
    const scoreLabel = (s) => s >= 80 ? "Buono" : s >= 55 ? "Migliorabile" : "Critico";

    function ScoreRing({ score, size = 80 }) {
      const r = 28;
      const circ = 2 * Math.PI * r;
      const offset = circ - (score / 100) * circ;
      const color = scoreColor(score);
      return (
        <svg width={size} height={size} viewBox="0 0 72 72">
          <circle cx="36" cy="36" r={r} fill="none" stroke="#1e1e2e" strokeWidth="6" />
          <circle cx="36" cy="36" r={r} fill="none" stroke={color} strokeWidth="6"
            strokeDasharray={circ} strokeDashoffset={offset} strokeLinecap="round"
            transform="rotate(-90 36 36)" style={{ transition: "stroke-dashoffset 1s ease" }} />
          <text x="36" y="40" textAnchor="middle" fontSize="14" fontWeight="700"
            fill={color} fontFamily="'IBM Plex Mono', monospace">{score}</text>
        </svg>
      );
    }

    function IssueCard({ issue, index }) {
      const colorMap = { alta: "#ff4d4d", media: "#f0b429", bassa: "#7eb8f7" };
      const bgMap    = { alta: "#1a0a0a", media: "#15120a", bassa: "#0a0f1a" };
      const color = colorMap[issue.severity] || "#aaa";
      const bg    = bgMap[issue.severity]    || "#0d0d1a";
      return (
        <div style={{
          background: bg,
          border: "1px solid #1e1e2e",
          borderLeft: `3px solid ${color}`,
          borderRadius: "8px", padding: "16px 20px", marginBottom: "10px",
          animation: "fadeUp 0.4s ease both", animationDelay: `${index * 0.07}s`,
        }}>
          <div style={{ display: "flex", justifyContent: "space-between", marginBottom: "8px" }}>
            <span style={{
              fontFamily: "'IBM Plex Mono', monospace", fontSize: "10px",
              color, textTransform: "uppercase", letterSpacing: "1.2px",
              background: color + "18", padding: "2px 8px", borderRadius: "4px",
            }}>
              {issue.severity}
            </span>
            <span style={{ fontSize: "11px", color: "#444", fontFamily: "'IBM Plex Mono', monospace" }}>
              #{String(index + 1).padStart(2, "0")}
            </span>
          </div>
          <div style={{ color: "#e8e8f4", fontSize: "14px", fontWeight: "600", marginBottom: "6px", lineHeight: "1.4" }}>
            {issue.title}
          </div>
          <div style={{ color: "#8888a8", fontSize: "13px", lineHeight: "1.6" }}>{issue.description}</div>
          {issue.fix && (
            <div style={{
              marginTop: "10px", padding: "10px 14px",
              background: "#0d0d1a", borderRadius: "6px",
              borderLeft: "2px solid #2a2a4a",
              fontSize: "13px", color: "#c0c0d8",
              fontFamily: "'IBM Plex Mono', monospace", lineHeight: "1.5",
            }}>
              <span style={{ color: "#555", marginRight: "6px" }}>Fix:</span>{issue.fix}
            </div>
          )}
        </div>
      );
    }

    function MetricPill({ label, value }) {
      return (
        <div style={{
          background: "#0d0d1a", border: "1px solid #1e1e2e",
          borderRadius: "8px", padding: "14px 16px", textAlign: "center",
        }}>
          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: "15px", fontWeight: "500", color: "#e0e0f0" }}>{value}</div>
          <div style={{ fontSize: "10px", color: "#555", marginTop: "5px", textTransform: "uppercase", letterSpacing: "0.8px" }}>{label}</div>
        </div>
      );
    }

    function FlowChart({ currentStep }) {
      return (
        <div style={{ marginTop: "28px", padding: "24px 28px", background: "#0d0d1a", border: "1px solid #1e1e2e", borderRadius: "12px" }}>
          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: "10px", color: "#444", textTransform: "uppercase", letterSpacing: "1px", marginBottom: "20px" }}>
            Avanzamento analisi
          </div>
          {STEPS.map((step, i) => {
            const isDone    = i < currentStep;
            const isActive  = i === currentStep;
            const isPending = i > currentStep;
            return (
              <div key={step.id} style={{ display: "flex", alignItems: "flex-start", gap: "16px", marginBottom: i < STEPS.length - 1 ? "0" : "0" }}>
                <div style={{ display: "flex", flexDirection: "column", alignItems: "center", flexShrink: 0 }}>
                  <div style={{
                    width: "22px", height: "22px", borderRadius: "50%",
                    border: `2px solid ${isDone ? "#00e5a0" : isActive ? "#00b8d9" : "#1e1e2e"}`,
                    background: isDone ? "#00e5a0" : isActive ? "#00b8d922" : "transparent",
                    display: "flex", alignItems: "center", justifyContent: "center",
                    flexShrink: 0,
                    transition: "all 0.3s ease",
                  }}>
                    {isDone
                      ? <span style={{ fontSize: "11px", color: "#07070f", fontWeight: "700" }}>✓</span>
                      : isActive
                        ? <span style={{ width: "6px", height: "6px", borderRadius: "50%", background: "#00b8d9", animation: "pulse 1s ease infinite", display: "block" }} />
                        : <span style={{ width: "6px", height: "6px", borderRadius: "50%", background: "#1e1e2e", display: "block" }} />
                    }
                  </div>
                  {i < STEPS.length - 1 && (
                    <div style={{
                      width: "2px", height: "24px",
                      background: isDone ? "#00e5a044" : "#1e1e2e",
                      transition: "background 0.3s ease",
                    }} />
                  )}
                </div>
                <div style={{ paddingTop: "3px", paddingBottom: i < STEPS.length - 1 ? "24px" : "0" }}>
                  <div style={{
                    fontSize: "13px",
                    fontWeight: isActive ? "600" : "400",
                    color: isDone ? "#556655" : isActive ? "#e0e0f0" : "#3a3a5a",
                    animation: isActive ? "stepIn 0.3s ease both" : "none",
                    transition: "color 0.3s ease",
                  }}>
                    {step.label}
                  </div>
                  {isActive && (
                    <div style={{ fontSize: "11px", color: "#00b8d9", fontFamily: "'IBM Plex Mono', monospace", marginTop: "2px", animation: "stepIn 0.3s ease 0.1s both" }}>
                      in corso...
                    </div>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    async function fetchPageSpeed(url) {
      const psUrl = "https://www.googleapis.com/pagespeedonline/v5/runPagespeed?url=" + encodeURIComponent(url) + "&strategy=mobile&category=performance&category=accessibility&category=best-practices&category=seo";
      let res, data;
      try {
        res = await fetch(psUrl);
        data = await res.json();
      } catch (e) {
        throw new Error("Impossibile contattare PageSpeed: " + e.message);
      }
      if (!res.ok || data.error) {
        const msg = data?.error?.message || data?.error?.status || JSON.stringify(data).slice(0, 200);
        throw new Error("PageSpeed: " + msg);
      }
      if (!data.lighthouseResult) {
        throw new Error("Risposta PageSpeed non valida: " + JSON.stringify(data).slice(0, 200));
      }
      return data;
    }

    function extractPageSpeedData(data) {
      const cats   = data.lighthouseResult?.categories || {};
      const audits = data.lighthouseResult?.audits || {};
      const perfScore   = Math.round((cats.performance?.score || 0) * 100);
      const accessScore = Math.round((cats.accessibility?.score || 0) * 100);
      const bestScore   = Math.round((cats["best-practices"]?.score || 0) * 100);
      const seoScore    = Math.round((cats.seo?.score || 0) * 100);
      const fcp = audits["first-contentful-paint"]?.displayValue || "N/A";
      const lcp = audits["largest-contentful-paint"]?.displayValue || "N/A";
      const tbt = audits["total-blocking-time"]?.displayValue || "N/A";
      const cls = audits["cumulative-layout-shift"]?.displayValue || "N/A";
      const si  = audits["speed-index"]?.displayValue || "N/A";

      // Dati SEO specifici per fix mirati
      const seoAudits = Object.values(audits)
        .filter(a => a.score !== null && a.score < 1 && a.title)
        .filter(a => ['meta-description','document-title','link-text','crawlable-anchors','is-crawlable','robots-txt','image-alt','hreflang','canonical','structured-data','font-size','tap-targets','viewport'].includes(a.id))
        .map(a => `- [SEO] ${a.title}: ${a.description?.slice(0, 100) || ''} (score: ${Math.round((a.score||0)*100)})`);

      const perfAudits = Object.values(audits)
        .filter(a => a.score !== null && a.score < 0.9 && a.title)
        .sort((a, b) => (a.score || 0) - (b.score || 0))
        .slice(0, 10)
        .map(a => `- ${a.title} (score: ${Math.round((a.score || 0) * 100)})`);

      return { perfScore, accessScore, bestScore, seoScore, fcp, lcp, tbt, cls, si, perfAudits, seoAudits };
    }

    async function generateAIReport(url, ps) {
      const overallScore  = Math.round((ps.perfScore + ps.accessScore + ps.bestScore + ps.seoScore) / 4);
      const checkoutScore = Math.round((ps.perfScore + ps.bestScore) / 2);

      const prompt = `Sei un esperto senior di e-commerce, CRO e SEO tecnico. Analizza questi dati REALI misurati da Google PageSpeed per ${url}.

PUNTEGGI MISURATI:
Performance: ${ps.perfScore}/100 | Accessibilita: ${ps.accessScore}/100 | Best Practices: ${ps.bestScore}/100 | SEO: ${ps.seoScore}/100

CORE WEB VITALS:
FCP: ${ps.fcp} | LCP: ${ps.lcp} | TBT: ${ps.tbt} | CLS: ${ps.cls} | Speed Index: ${ps.si}

PROBLEMI PERFORMANCE RILEVATI:
${ps.perfAudits.join("\n")}

PROBLEMI SEO SPECIFICI RILEVATI:
${ps.seoAudits.length > 0 ? ps.seoAudits.join("\n") : "Nessun problema SEO critico rilevato"}

ISTRUZIONI IMPORTANTI:
- Per la categoria SEO fornisci fix MOLTO specifici e actionable: indica esattamente quale tag HTML modificare, quale testo aggiungere, quale elemento ottimizzare. Non dire solo "ottimizza la SEO", di' COSA fare e COME.
- Per performance indica metriche specifiche (es: "LCP di ${ps.lcp} e' troppo lento, ottimizza l'immagine hero")
- Ogni description deve essere 2-3 frasi che spiegano l'impatto sul business
- Ogni fix deve essere un'azione concreta eseguibile, non generica

Rispondi SOLO con JSON valido, nessun testo fuori dal JSON.

{"siteName":"nome brand","overallScore":${overallScore},"categories":{"performance":{"score":${ps.perfScore},"issues":[{"title":"titolo specifico","description":"descrizione impatto business in 2-3 frasi","fix":"azione concreta e specifica da eseguire","severity":"alta"},{"title":"titolo","description":"descrizione","fix":"fix specifico","severity":"media"}]},"ux":{"score":${ps.accessScore},"issues":[{"title":"titolo","description":"descrizione","fix":"fix","severity":"media"},{"title":"titolo","description":"descrizione","fix":"fix","severity":"bassa"}]},"checkout":{"score":${checkoutScore},"issues":[{"title":"titolo","description":"descrizione","fix":"fix","severity":"alta"},{"title":"titolo","description":"descrizione","fix":"fix","severity":"media"}]},"seo":{"score":${ps.seoScore},"issues":[{"title":"titolo specifico problema SEO","description":"spiega esattamente quale elemento manca o e' sbagliato e perche conta per il ranking","fix":"indica il tag HTML esatto da aggiungere o modificare con un esempio concreto","severity":"alta"},{"title":"titolo","description":"descrizione dettagliata","fix":"fix con esempio concreto","severity":"media"}]},"trust":{"score":${ps.bestScore},"issues":[{"title":"titolo","description":"descrizione","fix":"fix","severity":"media"},{"title":"titolo","description":"descrizione","fix":"fix","severity":"bassa"}]}},"topWins":["azione rapida e specifica 1","azione rapida 2","azione rapida 3"],"summary":"frase di sintesi sul problema principale reale con dati specifici"}`;

      const res = await fetch("proxy.php", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt })
      });

      if (!res.ok) throw new Error("Errore dal proxy: " + res.status);
      const data = await res.json();

      if (data.debug) throw new Error("Errore API: " + JSON.stringify(data.debug) + " — " + JSON.stringify(data.risposta_completa?.error?.message || ""));

      const text = data.content?.find(b => b.type === "text")?.text || "";
      const match = text.match(/\{[\s\S]*\}/);
      if (!match) throw new Error("Risposta AI non valida. Testo ricevuto: " + text.slice(0, 300));
      try {
        return JSON.parse(match[0]);
      } catch(e) {
        throw new Error("JSON non valido: " + e.message);
      }
    }

    function downloadReport(report, metrics, url) {
      const lines = [];
      lines.push("DRIPLIK — REPORT AUDIT E-COMMERCE");
      lines.push("=".repeat(50));
      lines.push("Sito: " + url);
      lines.push("Data: " + new Date().toLocaleDateString("it-IT"));
      lines.push("");
      lines.push("PUNTEGGIO GLOBALE: " + report.overallScore + "/100 — " + scoreLabel(report.overallScore));
      lines.push(report.summary);
      lines.push("");
      lines.push("CORE WEB VITALS");
      lines.push("-".repeat(30));
      lines.push("FCP: " + metrics.fcp + " | LCP: " + metrics.lcp + " | TBT: " + metrics.tbt + " | CLS: " + metrics.cls);
      lines.push("");
      if (report.topWins) {
        lines.push("QUICK WINS — COSA FARE SUBITO");
        lines.push("-".repeat(30));
        report.topWins.forEach((w, i) => lines.push((i+1) + ". " + w));
        lines.push("");
      }
      ["performance","ux","checkout","seo","trust"].forEach(key => {
        const cat = report.categories?.[key];
        if (!cat) return;
        const label = { performance:"PERFORMANCE", ux:"UX & DESIGN", checkout:"CHECKOUT", seo:"SEO", trust:"FIDUCIA & SICUREZZA" }[key];
        lines.push(label + " — Punteggio: " + cat.score + "/100");
        lines.push("-".repeat(30));
        cat.issues?.forEach(issue => {
          lines.push("[" + issue.severity.toUpperCase() + "] " + issue.title);
          lines.push("Problema: " + issue.description);
          lines.push("Fix: " + issue.fix);
          lines.push("");
        });
      });
      lines.push("=".repeat(50));
      lines.push("Report generato da Driplik — driplik.com");

      const blob = new Blob([lines.join("\n")], { type: "text/plain;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "driplik-report-" + new Date().toISOString().slice(0,10) + ".txt";
      a.click();
    }

    function App() {
      const [url, setUrl]         = useState("");
      const [loading, setLoading] = useState(false);
      const [stepIdx, setStepIdx] = useState(0);
      const [report, setReport]   = useState(null);
      const [metrics, setMetrics] = useState(null);
      const [auditUrl, setAuditUrl] = useState("");
      const [error, setError]     = useState(null);
      const [activeTab, setActiveTab] = useState("performance");

      const runAudit = async () => {
        if (!url.trim()) return;
        const fullUrl = url.startsWith("http") ? url : "https://" + url;
        setLoading(true);
        setReport(null);
        setMetrics(null);
        setError(null);
        setStepIdx(0);

        try {
          setStepIdx(0);
          await new Promise(r => setTimeout(r, 300));
          setStepIdx(1);
          const psRaw = await fetchPageSpeed(fullUrl);
          setStepIdx(2);
          const ps = extractPageSpeedData(psRaw);
          setMetrics(ps);
          setStepIdx(3);
          await new Promise(r => setTimeout(r, 400));
          setStepIdx(4);
          const rep = await generateAIReport(fullUrl, ps);
          setStepIdx(5);
          await new Promise(r => setTimeout(r, 300));
          setReport(rep);
          setAuditUrl(fullUrl);
          setActiveTab("performance");
        } catch (e) {
          setError(e.message || "Errore durante l'analisi. Riprova.");
        } finally {
          setLoading(false);
        }
      };

      return (
        <div style={{ minHeight: "100vh", background: "#07070f", color: "#e0e0f0" }}>

          {/* Header */}
          <div style={{ borderBottom: "1px solid #141420", padding: "18px 40px", display: "flex", alignItems: "center", gap: "12px" }}>
            <div style={{ width: "34px", height: "34px", background: "#00e5a0", borderRadius: "8px", display: "flex", alignItems: "center", justifyContent: "center" }}>
              <span style={{ color: "#07070f", fontSize: "16px", fontWeight: "700" }}>D</span>
            </div>
            <span style={{ fontWeight: "700", fontSize: "16px", letterSpacing: "-0.3px" }}>Driplik</span>
            <span style={{ marginLeft: "auto", fontFamily: "'IBM Plex Mono', monospace", fontSize: "11px", color: "#333", letterSpacing: "1px" }}>BETA</span>
          </div>

          {/* Hero */}
          <div style={{ padding: "56px 40px 40px", maxWidth: "760px", margin: "0 auto" }}>
            <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: "11px", color: "#557766", letterSpacing: "2px", marginBottom: "16px", textTransform: "uppercase" }}>
              Analisi reale — Google PageSpeed Insights
            </div>
            <h1 style={{ fontSize: "clamp(28px, 4.5vw, 48px)", fontWeight: "700", lineHeight: "1.1", letterSpacing: "-1.5px", marginBottom: "14px" }}>
              Scopri perche{" "}
              <span style={{ background: "linear-gradient(90deg, #00e5a0, #00b8d9)", WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent" }}>
                stai perdendo vendite
              </span>
            </h1>
            <p style={{ color: "#5a5a7a", fontSize: "15px", lineHeight: "1.7", marginBottom: "36px" }}>
              Performance reali misurate da Google, interpretate dall'AI per darti consigli concreti.
            </p>

            <div style={{ display: "flex", gap: "10px", flexWrap: "wrap" }}>
              <input value={url} onChange={e => setUrl(e.target.value)}
                onKeyDown={e => e.key === "Enter" && !loading && runAudit()}
                placeholder="https://il-tuo-negozio.com"
                style={{
                  flex: 1, minWidth: "260px", background: "#0d0d1a",
                  border: "1px solid #1e1e2e", borderRadius: "8px",
                  padding: "13px 18px", fontSize: "14px", color: "#e0e0f0",
                  fontFamily: "'IBM Plex Mono', monospace", transition: "border-color 0.2s",
                }} />
              <button onClick={runAudit} disabled={loading || !url.trim()} style={{
                background: loading ? "#0d0d1a" : "#00e5a0",
                color: loading ? "#444" : "#07070f",
                border: "1px solid " + (loading ? "#1e1e2e" : "transparent"),
                borderRadius: "8px", padding: "13px 26px", fontSize: "14px",
                fontWeight: "600", cursor: loading ? "not-allowed" : "pointer",
                transition: "all 0.2s", whiteSpace: "nowrap",
              }}>
                {loading ? "Analisi in corso..." : "Analizza ora"}
              </button>
            </div>

            {loading && <FlowChart currentStep={stepIdx} />}

            {error && (
              <div style={{ marginTop: "20px", padding: "16px", background: "#110808", border: "1px solid #ff4d4d33", borderRadius: "8px", color: "#ff6b6b", fontSize: "13px", lineHeight: "1.5" }}>
                {error}
              </div>
            )}
          </div>

          {/* Report */}
          {report && metrics && (
            <div style={{ maxWidth: "760px", margin: "0 auto", padding: "0 40px 80px", animation: "fadeUp 0.5s ease" }}>

              {/* Core Web Vitals */}
              <div style={{ marginBottom: "24px" }}>
                <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: "10px", color: "#444", textTransform: "uppercase", letterSpacing: "1px", marginBottom: "10px" }}>
                  Core Web Vitals misurati
                </div>
                <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(110px, 1fr))", gap: "8px" }}>
                  <MetricPill label="FCP" value={metrics.fcp} />
                  <MetricPill label="LCP" value={metrics.lcp} />
                  <MetricPill label="TBT" value={metrics.tbt} />
                  <MetricPill label="CLS" value={metrics.cls} />
                  <MetricPill label="Speed Index" value={metrics.si} />
                </div>
              </div>

              {/* Overall score */}
              <div style={{ background: "#0d0d1a", border: "1px solid #1e1e2e", borderRadius: "12px", padding: "24px 28px", marginBottom: "16px", display: "flex", alignItems: "center", gap: "24px", flexWrap: "wrap" }}>
                <ScoreRing score={report.overallScore} size={88} />
                <div style={{ flex: 1 }}>
                  <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: "10px", color: "#444", marginBottom: "4px", textTransform: "uppercase", letterSpacing: "1px" }}>
                    Punteggio globale — {report.siteName}
                  </div>
                  <div style={{ fontSize: "20px", fontWeight: "700", letterSpacing: "-0.5px", marginBottom: "6px", color: "#e8e8f4" }}>
                    {scoreLabel(report.overallScore)}
                  </div>
                  <div style={{ color: "#6a6a8a", fontSize: "13px", lineHeight: "1.6" }}>{report.summary}</div>
                </div>
              </div>

              {/* Download button */}
              <div style={{ marginBottom: "24px", textAlign: "right" }}>
                <button onClick={() => downloadReport(report, metrics, auditUrl)} style={{
                  background: "transparent", border: "1px solid #1e1e2e", borderRadius: "8px",
                  padding: "9px 18px", fontSize: "12px", color: "#888", cursor: "pointer",
                  fontFamily: "'IBM Plex Mono', monospace", letterSpacing: "0.5px",
                  transition: "all 0.2s",
                }}
                  onMouseEnter={e => { e.target.style.borderColor = "#00e5a044"; e.target.style.color = "#ccc"; }}
                  onMouseLeave={e => { e.target.style.borderColor = "#1e1e2e"; e.target.style.color = "#888"; }}
                >
                  Scarica report .txt
                </button>
              </div>

              {/* Quick wins */}
              {report.topWins && (
                <div style={{ background: "#0a100d", border: "1px solid #1a2e22", borderRadius: "10px", padding: "18px 22px", marginBottom: "24px" }}>
                  <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: "10px", color: "#446655", textTransform: "uppercase", letterSpacing: "1px", marginBottom: "14px" }}>
                    Quick wins — cosa fare subito
                  </div>
                  {report.topWins.map((win, i) => (
                    <div key={i} style={{ display: "flex", gap: "12px", marginBottom: i < report.topWins.length - 1 ? "10px" : "0", alignItems: "flex-start" }}>
                      <span style={{ color: "#446655", fontFamily: "'IBM Plex Mono', monospace", fontSize: "11px", marginTop: "2px", flexShrink: 0 }}>{String(i + 1).padStart(2, "0")}</span>
                      <span style={{ color: "#b0b8b4", fontSize: "13px", lineHeight: "1.5" }}>{win}</span>
                    </div>
                  ))}
                </div>
              )}

              {/* Category tabs */}
              <div style={{ display: "flex", gap: "6px", marginBottom: "16px", flexWrap: "wrap" }}>
                {CATEGORIES.map(cat => {
                  const catData  = report.categories?.[cat.key];
                  if (!catData) return null;
                  const isActive = activeTab === cat.key;
                  const sColor   = scoreColor(catData.score);
                  return (
                    <button key={cat.key} onClick={() => setActiveTab(cat.key)} style={{
                      background: isActive ? "#13131f" : "transparent",
                      border: `1px solid ${isActive ? "#2a2a44" : "#1a1a2e"}`,
                      borderRadius: "8px", padding: "9px 14px", cursor: "pointer",
                      display: "flex", alignItems: "center", gap: "7px", transition: "all 0.15s",
                    }}>
                      <span style={{
                        width: "20px", height: "20px", borderRadius: "5px",
                        background: isActive ? sColor + "22" : "#1a1a2e",
                        display: "flex", alignItems: "center", justifyContent: "center",
                        fontSize: "11px", flexShrink: 0,
                      }}>
                        {cat.icon}
                      </span>
                      <span style={{ color: isActive ? "#e0e0f0" : "#5a5a7a", fontSize: "13px", fontWeight: isActive ? "600" : "400" }}>
                        {cat.label}
                      </span>
                      <span style={{
                        fontFamily: "'IBM Plex Mono', monospace", fontSize: "11px",
                        color: isActive ? sColor : "#444",
                        background: isActive ? sColor + "15" : "transparent",
                        padding: "1px 6px", borderRadius: "4px",
                        marginLeft: "2px",
                      }}>
                        {catData.score}
                      </span>
                    </button>
                  );
                })}
              </div>

              {report.categories?.[activeTab]?.issues?.map((issue, i) => (
                <IssueCard key={i} issue={issue} index={i} />
              ))}

              <div style={{ marginTop: "40px", padding: "14px 18px", background: "#0a0a14", border: "1px solid #141420", borderRadius: "8px", fontFamily: "'IBM Plex Mono', monospace", fontSize: "10px", color: "#333", textAlign: "center", letterSpacing: "0.3px" }}>
                Dati misurati da Google PageSpeed Insights, interpretati da AI — non sostituisce una consulenza professionale
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
